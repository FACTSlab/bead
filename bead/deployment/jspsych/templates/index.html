<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    <link href="runtime/jspsych.css" rel="stylesheet" />
    <link href="runtime/survey.css" rel="stylesheet" />

    <!-- Custom experiment CSS -->
    <link href="css/experiment.css" rel="stylesheet" type="text/css" />

    <script src="runtime/jspsych.js"></script>
    <script src="runtime/html-keyboard-response.js"></script>
    <script src="runtime/html-button-response.js"></script>
    <script src="runtime/instructions.js"></script>
    {% if session_adapter %}
    <script src="runtime/browser-check.js"></script>
    <script src="runtime/fullscreen.js"></script>
    <script src="runtime/survey-html-form.js"></script>
    {% endif %}
    <script src="runtime/survey.js"></script>

    {% if use_jatos %}
    <!-- JATOS integration -->
    <script src="jatos.js"></script>
    {% endif %}

    <!-- Bead plugins -->
    <script src="js/gallery-bundle.js"></script>

    <!-- List distribution system -->
    <script src="js/list_distributor.js"></script>
    {% if session_adapter %}
    <script src="js/session-adapter.js"></script>
    {% endif %}

    {% if slopit_enabled %}
    <!-- Slopit behavioral capture -->
    <script src="js/slopit-bundle.js"></script>
    {% endif %}

</head>
<body class="theme-{{ ui_theme }}">
    <div id="jspsych-target"></div>

    <!-- Main experiment script -->
    <script src="js/experiment.js"></script>
</body>
</html>
