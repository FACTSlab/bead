    # ========================================================================
    verb:
      strategy: "exhaustive"
      description: "ALL UniMorph verbs (exhaustive cross-product with all frames)"

    comp_verb_adn:
      strategy: "exhaustive"
      description: "All V.ADN.PRS bleached verb forms for -는 것을 (factive) and -는지 (indirect Q) complements (7 entries from comp_verbs.jsonl)"

    comp_verb_decl:
