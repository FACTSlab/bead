  filling_strategy: "mixed"

  # Output path for filled templates
  output_path: "filled_templates/generic_frames_filled.jsonl"

  # MLM (Masked Language Model) settings for smart filling
  mlm:
    model_name: "klue/bert-base"
    beam_size: 5
    top_k: 10
    device: "cpu"
    cache_enabled: true

  # Slot-specific strategies
  # - exhaustive: Use all entries from lexicon (for cross-product design)
  # - mlm: Use MLM to select contextually appropriate fillers
  #   - max_fills: Limit to top-N items by MLM probability (after constraint filtering)
  #   - enforce_unique: Ensure each beam hypothesis uses different items for this slot
  #
  # MLM used for all slots EXCEPT determiners and "be" forms
  # Constraints from templates are preserved and used to filter MLM predictions
  slot_strategies:
    # ========================================================================
    # DETERMINERS - EXHAUSTIVE (no MLM)
    # ========================================================================
    # det_subj:
    #   strategy: "exhaustive"
    #   description: "All subject determiners"

    # det_dobj:
    #   strategy: "exhaustive"
    #   description: "All direct object determiners"

    # det_iobj:
    #   strategy: "exhaustive"
    #   description: "All indirect object determiners"

    # det_pobj:
    #   strategy: "exhaustive"
    #   description: "All prepositional object determiners"

    # det_pobj2:
    #   strategy: "exhaustive"
    #   description: "All second prepositional object determiners"

    # det_pobj3:
    #   strategy: "exhaustive"
    #   description: "All third prepositional object determiners"

    # ========================================================================
    # BE FORMS - EXHAUSTIVE (no MLM)
    # Constraints enforce subject-verb agreement
    # ========================================================================
    # be:
    #   strategy: "exhaustive"
    #   description: "All forms of 'be' (am, is, are, was, were, been, being) with constraint-based agreement"

    aux:
      strategy: "exhaustive"
      description: "All auxiliary verbs from lexicons (past and present progressive forms)"

    # ========================================================================
    # Case Particles - EXHAUSTIVE (no MLM)
    # ========================================================================
    nom:
      strategy: "exhaustive"
      description: "All nominative case markers from lexicons"
    
    acc:
      strategy: "exhaustive"
      description: "All accusative case markers from lexicons"

    inst:
      strategy: "exhaustive"
      description: "All instrumental case markers from lexicons"

    dat:
      strategy: "exhaustive"
      description: "All dative case particles from lexicons"

    loc:
      strategy: "exhaustive"
      description: "Source locative case particle (에서) from lexicons"

    goal:
      strategy: "exhaustive"
      description: "Goal locative case particle (에) from lexicons"

    com:
      strategy: "exhaustive"
      description: "Comitative case marker (와/과) — allomorphic, fc_agree required"

    term:
      strategy: "exhaustive"
      description: "Terminative case marker (까지) — invariant"

    init:
      strategy: "exhaustive"
      description: "Initiative case marker (부터) — invariant"

    # ========================================================================
    # SPATIAL NOUNS (의존명사) — EXHAUSTIVE
    # Postpositional relational nouns (pos=NPOST); immediately followed by
    # a locative case marker slot (goal/loc/inst) in spatial frames.
    # ========================================================================
    spatial_noun:
      strategy: "exhaustive"
      description: "All spatial/temporal relational nouns (위, 아래, 앞, etc.)"

    # ========================================================================
    # COMPLEX POSTPOSITIONS (다단어 후치사) — EXHAUSTIVE
    # DAT-governed: particle 에 is built into the form (에 대해서, etc.)
    # ACC-governed: preceded by a separate 을/를 slot (통해서, 위해서, etc.)
    # ========================================================================
    complex_postp_dat:
      strategy: "exhaustive"
      description: "All DAT-governed complex postpositions (에 대해서, 에 의해서, etc.)"

    complex_postp_acc:
      strategy: "exhaustive"
      description: "All ACC-governed complex postpositions (통해서, 위해서, etc.)"

    pobj_acc:
      strategy: "exhaustive"
      description: "Accusative case marker for complex postposition object (transitive ACC frames)"

    # ========================================================================
    # MAIN VERB - EXHAUSTIVE (no MLM)
