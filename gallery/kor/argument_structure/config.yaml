# Concrete-Template Scoring (score_concrete_templates.py)
# ============================================================================
# Scores concrete templates by masking the verb and beam-decoding the model's
# best verb form (klue/bert-base); raw_score = that form's log-probability.
# Scoring is a sample: sample_per_cell concrete templates per frame_class x
# aspect cell, split evenly across the cell's frames (exhaustive scoring of
# all ~5.5M is unnecessary). CLI flags
# override; `--exhaustive` scores everything.
concrete_template_scoring:
  output: "concrete_template_scores/cell_sample_scores.jsonl"
  sample_per_cell: 250       # make data (quick) uses 40
  seed: 0
  beam_width: 5
  max_verb_tokens: 3
  chunk_size: 16             # near-optimal on CPU (larger measured slightly worse)

# Concrete-Template Binning & Selection (bin_concrete_templates.py)
# ============================================================================
# A frame is the abstract variant (NP-NOM NP-ACC ___; templates/
# generic_frames.jsonl); a concrete template is a frame with everything but
# the verb filled (사람이 물건을 ___). Concrete templates are scored by
# score_concrete_templates.py --sample-per-cell. Scores are only comparable
# within a frame_class x aspect cell, so bins are equal-count quantiles
# computed per cell; the same number is then drawn from every bin, keeping
# both natural (high) and anomalous (low) ones.
concrete_template_binning:
  input: "concrete_template_scores/cell_sample_scores.jsonl"
  output: "concrete_template_scores/selected_concrete_templates.jsonl"
  summary: "concrete_template_scores/bin_summary.json"
  score_field: "raw_score"   # beam_mass / raw_n_tokens are diagnostics only
  n_bins: 5                  # mirrors English grid_stratification n_quantiles
  min_per_bin: 8             # fewer bins for small cells (NP_V: 19 -> 2 bins)
  per_bin: 4                 # selected per bin: 24 cells x 5 x 4 + 3 NP_V cells x 2 x 4 = 504
  seed: 42

# Concrete-Template Pair Construction (create_concrete_template_pairs.py)
# ============================================================================
# Builds 2AFC items from the selected concrete templates. different_verb: one
# concrete template, two lexicon verbs (same form). same_verb: one verb, two
# concrete templates of the same aspect but different frame_class. Verbs are dealt from a shuffled deck
# of every verb-slot lemma so coverage stays even; no restriction on which
# verbs or arguments combine -- acceptability is for the experiment to judge.
concrete_template_pairs:
  input: "concrete_template_scores/selected_concrete_templates.jsonl"
  output: "items/2afc_pairs.jsonl"    # consumed by generate_lists.py
  scoring_summary: "items/2afc_pairs_scoring.json"  # rarity-correction fit
  drop_adjectives: true    # leave the 686 predicate adjectives out of the verb deck (false: keep)
  different_verb_per_concrete_template: 1
  same_verb_per_concrete_template: 1
  score_batch_size: 64
  seed: 42

# Past-Tense Test Path (sample_concrete_templates.py -> select_pairs.py)
# ============================================================================
# Simplified sampling, simple-aspect frames and past-tense verbs only
# (make data-past). Replaces beam decoding + template binning: concrete
# templates are allocated evenly per frame with fillers balanced, and each gets
# a two-mask carrier score ([MASK][MASK]##다: stem, then past-tense piece
# given the stem), kept as metadata and used to
# match same_verb partners. Pairs are scored with their real verbs, binned by
# score gap (n_bins per pair type) and selected equally per bin, least-used
# verbs first. Coverage target: every verb at least once, so n_lists x
# lists.split_by.per_list pairs (27 x 25 + 25 = 1,350 covers 1,988 verbs).
past_test:
  templates_output: "concrete_template_scores/past_templates.jsonl"
  templates_summary: "concrete_template_scores/past_templates_summary.json"
  pairs_summary: "items/2afc_pairs_selection.json"   # pairs go to paths.2afc_pairs
  n_lists: 27                  # must match PAST_N_LISTS in the Makefile
  pair_candidate_factor: 3     # candidate pairs per selected pair (pool for the bins)
  template_candidate_factor: 8 # uniform draws per template picked (filler balancing)
  stem_top_k: 5                # carrier score: stems tried before filling the tense mask
  n_bins: 5                    # score-gap bins per pair type
  subject_mismatch_cost: 0.05  # same_verb partner matching, in carrier-percentile units
  drop_adjectives: true
  score_batch_size: 64
  seed: 42

# Items Configuration — LEGACY (create_2afc_pairs.py: whole-sentence LM
# scoring with polyglot-ko). The current pairs step scores the verb with
# klue/bert-base and corrects for verb rarity (concrete_template_pairs).
# ============================================================================
items:
  # Judgment type: "forced_choice", "acceptability_rating", "inference"
  judgment_type: "forced_choice"

  # Number of alternatives in forced choice
  n_alternatives: 2  # 2AFC

  # Language models for scoring items
  models:
    - name: "EleutherAI/polyglot-ko-1.3b"
      provider: "huggingface"
      device: "cpu"
      use_for_scoring: true

    # Optional: Additional models for comparison
    # - name: "gpt2-medium"
    #   provider: "huggingface"
    #   device: "cpu"

  # Item construction settings
  construction:
    # Create minimal pairs
    create_minimal_pairs: true
    pair_types:
      - "same_verb"       # Same verb, different frames
      - "different_verb"  # Different verbs, same frame

    # Score-based filtering
    score_filtering:
      enabled: true
      min_score_diff: 0.5  # Minimum LM score difference for interesting pairs

  # Item metadata to preserve
  preserve_metadata:
    - "verb_lemma"
    - "template_id"
    - "template_name"
    - "template_structure"
    - "pair_type"
    - "lm_score_diff"
    - "quantile"

# List Partitioning Configuration
# ============================================================================
lists:
  # Partitioning strategy. Not a bead strategy name: bead only has
  # balanced/random/stratified, and generate_lists.py uses "balanced" (the
  # batch and split paths never passed this value on).
  strategy: "quantile_balanced_minimal_pairs"

  # Number of experimental lists to create
  n_lists: 16

  # Items per list
  items_per_list: 50

  # Seed for the pool sample (n_lists x items_per_list pairs) and partitioner
  random_seed: 42

  # Quantile settings for difficulty stratification: quantile_bins is used by
  # create_concrete_template_pairs.py (quantiles of lm_score_diff per
  # pair_type); items_per_quantile is UNUSED.
  quantile_bins: 10
  items_per_quantile: 10

  # Exact per-list composition: each pair_type is partitioned separately into
  # n_lists x per_list items and list i of each is merged (generate_lists.
  # split_partition). Replaces a list-level balance constraint on pair_type:
  # bead's greedy partitioner treats balance as pass/fail, so 25/25 that way
  # made list sizes drift to 47-54 without balancing (same_verb 18-30/list).
  # per_list must sum to items_per_list.
  split_by:
    property_expression: "item.metadata.pair_type"
    per_list:
      same_verb: 25
      different_verb: 25

  # Constraints for list balancing (applied within each split stratum)
  constraints:
    # Ensure verb uniqueness within lists (use verb for same-verb pairs, verb1 for different-verb pairs)
    - type: "uniqueness"
      property_expression: "item.metadata.get('verb1', item.metadata.get('verb'))"
      description: "No verb appears multiple times in same list"

    # Stratify by LM score difference (grouped by pair type). NOT ENFORCED:
    # bead's partitioner records grouped_quantile/diversity list constraints
    # but does not act on them (it warns). Lists still cover 9-10 quantiles.
    - type: "grouped_quantile"
      property_expression: "item.metadata.lm_score_diff"
      group_by_expression: "item.metadata.pair_type"
      n_quantiles: 10
      items_per_quantile: 5
      description: "Stratified sampling of LM score differences by pair type"

    # Frame diversity
    - type: "diversity"
      property_expression: "item.metadata.frame_id"
      min_unique_values: 15
      description: "Ensure diverse set of frames in each list"

  # Batch-level constraints (apply across ALL lists)
  batch_constraints:
    # Batch expressions see the same item dict as list constraints --
    # {"metadata": item_metadata}, built by generate_lists.load_2afc_pairs --
    # so they use item.metadata.X; the old item['X'] form never evaluated and
    # every batch constraint was silently ignored.

    # Ensure every frame in the pair pool appears somewhere in the batch.
    # target_values "from_pool" = every distinct value in items/2afc_pairs.jsonl,
    # computed by generate_lists.py (frame ids are UUIDs that change on
    # regeneration, and the old hard-coded [0..25] could never match).
    - type: "coverage"
      property_expression: "item.metadata.frame_id"
      target_values: "from_pool"
      min_coverage: 1.0
      description: "Require 100% of frames appear somewhere in the batch"

    # Ensure balanced pair types across entire batch
    - type: "balance"
      property_expression: "item.metadata.pair_type"
      target_distribution:
        same_verb: 0.5
        different_verb: 0.5
      tolerance: 0.05
      description: "50/50 split of pair types across all lists combined"

    # Ensure each quantile appears at least 50 times total
    - type: "min_occurrence"
      property_expression: "item.metadata.quantile"
      min_occurrences: 50
      description: "Minimum representation of each quantile bin"

    # Ensure no verb appears in more than 4 lists
    - type: "diversity"
      property_expression: "item.metadata.get('verb1', item.metadata.get('verb'))"
      max_lists_per_value: 4
      description: "Spread verbs across participants (max 4/8 lists per verb)"

# Active-Learning Simulation (simulate_pipeline.py)
# ============================================================================
# Simulated annotators choose between a pair's two sentences with probability
# softmax(score / temperature), from the pair's rarity-corrected verb scores
# (score: lm_score; lm_raw = uncorrected). A forced-choice model is trained on
# their judgments, and each round the model's most uncertain pool pairs are
# annotated next (selector: uncertainty; random = baseline), until test
# accuracy is within convergence_threshold of the simulated annotators' own
# percentage agreement. The test set is held out of the pool.
simulation:
  pairs: "items/2afc_pairs.jsonl"
  output_dir: "simulation_output"
  score: "lm_score"
  temperature: 1.0
  test_size: 150
  initial_size: 100
  budget_per_iteration: 50
  max_iterations: 10
  selector: "uncertainty"
  uncertainty_method: "entropy"   # entropy, margin, least_confidence
  convergence_threshold: 0.05
  min_iterations: 2
  seed: 42
  model:
    model_name: "klue/roberta-base"
    device: "mps"                  # cpu, cuda or mps
    num_epochs: 3
    batch_size: 16

# Training Configuration — UNUSED (active learning not ported from English)
# ============================================================================
training:
  # Convergence detection settings
  convergence:
    # Metric for human baseline agreement
    # Options: "krippendorff_alpha", "fleiss_kappa", "cohens_kappa", "percentage_agreement"
    metric: "krippendorff_alpha"

    # Convergence threshold (how close to human agreement)
    # Model is converged when: |model_accuracy - human_agreement| < threshold
    threshold: 0.05

    # Minimum iterations before checking convergence
    min_iterations: 3

    # Statistical significance level for convergence test
    alpha: 0.05

  # Model training settings
  model:
    # Model architecture (for future implementation)
    architecture: "transformer"
    model_name: "klue/bert-base"

    # Training hyperparameters
    learning_rate: 2e-5
    batch_size: 16
    epochs_per_iteration: 3
    warmup_steps: 100

    # Device
    device: "cpu"

  # Data settings
  data:
    # Train/validation split
    validation_split: 0.2

    # Random seed for reproducibility
    random_seed: 42

    # Class balancing
    balance_classes: true

# Active Learning Configuration — UNUSED (run_pipeline.py not ported)
# ============================================================================
active_learning:
  # Selection strategy: "uncertainty_sampling", "query_by_committee", "random"
  strategy: "uncertainty_sampling"

  # Uncertainty method: "entropy", "least_confidence", "margin"
  method: "entropy"

  # Budget per iteration (items to select and annotate)
  budget_per_iteration: 200

  # Maximum iterations
  max_iterations: 20

  # Stopping criterion: "max_iterations", "performance_threshold", "convergence"
  stopping_criterion: "convergence"

  # Initial training set size
  initial_training_size: 500

  # Batch mode (select multiple items at once)
  batch_mode: true

  # Diversity promotion in batch selection
  promote_diversity: true
  diversity_lambda: 0.1

# Evaluation Configuration — UNUSED (no evaluation script yet)
# ============================================================================
evaluation:
  # Cross-validation settings
  cross_validation:
    # K-fold CV
    k_folds: 5

    # Stratification variable
    stratify_by: "metadata.pair_type"

    # Shuffle before splitting
    shuffle: true
    random_seed: 42

  # Metrics to compute
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "confusion_matrix"

  # Inter-annotator agreement metrics
  interannotator:
    metrics:
      - "krippendorff_alpha"
      - "fleiss_kappa"
      - "percentage_agreement"
      - "pairwise_agreement"

    # Minimum number of raters per item
    min_raters_per_item: 3

  # Model performance tracking
  tracking:
    # Save checkpoints
    save_checkpoints: true
    checkpoint_dir: "checkpoints"

    # Tensorboard logging
    use_tensorboard: true
    log_dir: "logs"

    # Metrics to track per iteration
    track_metrics:
      - "train_accuracy"
      - "val_accuracy"
      - "human_agreement"
      - "convergence_gap"

# Deployment Configuration (for human data collection)
# ============================================================================
deployment:
  # Platform: "jatos", "prolific", "mturk" (UNUSED: generate_deployment.py
  # always builds a local and a JATOS version)
  platform: "jatos"

  # UNUSED: the list count comes from --n-lists (make deployment = 2,
  # make deployment-full = 16). Was 20, more than the 16 lists that exist.
  n_lists_to_deploy: 16

  # Random seed for reproducible list selection
  random_seed: 42

  # Output directory for deployment files (UNUSED: generate_deployment.py
  # --output-dir, default "deployment")
  output_dir: "deployment"

  # Experiment settings -- all participant-facing text is Korean.
  experiment:
    title: "문장 비교 실험"
    description: "두 문장 중 더 자연스러운 문장을 고르는 실험"
    estimated_duration_minutes: 15
    language: "ko"                 # <html lang>
    # The prompt shown above every pair comes from protocol.families[].anchor
    # (canonical_prompt), not from here.
    # One string per instruction page (translation of the English gallery's
    # single-page instructions).
    instructions:
      - "두 문장이 한 쌍으로 제시됩니다. 두 문장 중 더 자연스러운 문장을 골라주세요."
    button_label_next: "다음"
    button_label_finish: "실험 시작"
    # Text bead hard-codes in the generated files (experiment.js completion /
    # error screens, "Previous" button and progress-bar label, the forced-choice plugin's
    # "Option 1/2" and "Select", index.html lang). generate_deployment.py
    # replaces it after generation and warns if an expected string is missing.
    ui_text:
      progress_bar: "진행률"     # jsPsych progress-bar label (default "Completion Progress")
      previous: "이전"
      option_1: "문장 1"
      option_2: "문장 2"
      select: "선택"
      complete_heading: "✓ 완료"
      thanks: "참여해 주셔서 감사합니다!"
      recorded: "응답이 기록되었습니다."
      close_window: "이 창을 닫으셔도 됩니다."
      redirecting: "잠시 후 이동합니다..."
      error_heading: "실험 오류"
      error_label: "오류:"
      contact_admin: "실험 관리자에게 문의해 주세요."

  # jsPsych configuration
  jspsych:
    version: "8.0.0"  # Using jsPsych 8.x

    # JATOS integration (recommended for Prolific)
    use_jatos: true  # Enable JATOS integration (default: true)

    # Prolific integration (optional; passed to bead's ExperimentConfig by
    # generate_deployment.py). When deploying on Prolific via JATOS:
    # 1. Set prolific_completion_code to the code from your Prolific study
    # 2. bead generates the completion redirect URL
    # 3. Prolific participant IDs (PROLIFIC_PID, STUDY_ID, SESSION_ID) will be captured
    prolific_completion_code: null  # Set to your Prolific completion code when deploying
    # Example: prolific_completion_code: "C1A2B3C4"
    # This will auto-generate: https://app.prolific.co/submissions/complete?cc=C1A2B3C4

    # Trial settings (UNUSED: the forced-choice plugin fixes its own trial
    # type; no time limits are applied)
    trial:
      type: "html-button-response"
      stimulus_duration: null  # No time limit
      trial_duration: null

    # Button labels for 2AFC (not read by generate_deployment.py; the
    # plugin's labels come from experiment.ui_text option_1/option_2/select)
    choices:
      - "문장 1"
      - "문장 2"

    # Randomization
    randomize_order: true
    randomize_choices: true

  # Participant requirements (UNUSED by scripts; recruitment reference)
  participants:
    # Number of participants per list
    n_per_list: 30

    # Qualifications
    qualifications:
      - "Native Korean speaker"
      - "Age 18+"
      - "Approval rate > 95%"

    # Compensation
    payment_usd: 2.50
    bonus_usd: 0.50  # For high-quality responses

  # Server configuration for remote deployment (UNUSED by scripts)
  server:
    host: null  # Will prompt if null
    port: 22
    username: null  # Will prompt if null
    deploy_path: "/var/www/experiments"

# Logging Configuration
# ============================================================================
logging:
  level: "WARNING"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # Log files
  file:
    enabled: true
    path: "pipeline.log"
    max_bytes: 10485760  # 10 MB
    backup_count: 5

  # Console logging
  console:
    enabled: true
    colored: true
