# ============================================================================
# Korean Argument Structure Pipeline Configuration
# ============================================================================
#
# Collects 2AFC acceptability judgments on Korean verb x frame combinations,
# both grammatical (verb licensed for the frame) and ungrammatical, with the
# English gallery (gallery/eng/argument_structure) as the coverage baseline.
#
# Design: every verb can meet every frame, but the full cross-product is
# ~14.5 billion sentences, so it is sampled. A *frame* is the abstract
# variant (NP-NOM NP-ACC ___); a *concrete template* is a frame with every
# slot but the verb filled (사람이 물건을 ___). Concrete templates are scored
# (concrete_template_scoring), binned per frame_class x aspect and selected
# evenly across bins (concrete_template_binning), then paired with lexicon
# verbs (concrete_template_pairs), partitioned into lists and deployed.
#
# Sections read by the current pipeline: project, paths (2afc_pairs,
# experiment_lists), concrete_template_scoring, concrete_template_binning,
# concrete_template_pairs, lists, deployment. Sections marked LEGACY are read
# only by the superseded exhaustive-fill scripts (fill_templates.py,
# create_2afc_pairs.py); sections marked UNUSED are read by nothing yet.
# ============================================================================

# Project Metadata
# ============================================================================
project:
  name: "argument_structure"
  language_code: "kor"

# Paths Configuration
# ============================================================================
paths:
  # Base directories
  data_dir: "."
  output_dir: "."
  cache_dir: ".cache"

  # Specific paths
  lexicons_dir: "lexicons"
  templates_dir: "templates"
  items_dir: "items"
  lists_dir: "lists"
  filled_templates_dir: "filled_templates"

  # Output files
  cross_product_items: "items/cross_product_items.jsonl"   # LEGACY/UNUSED
  2afc_pairs: "items/2afc_pairs.jsonl"
  experiment_lists: "lists/experiment_lists.jsonl"

# Annotation Protocol
# ============================================================================
# The 2AFC question, declared once. protocol.py builds it into a bead
# AnnotationProtocol; create_concrete_template_pairs.py records the anchor
# name on every pair, generate_deployment.py builds the item template (and
# the prompt shown above each pair) from it, and the active-learning scripts
# read the response space from it. `make validate-protocol` checks it builds.
# Drift checks apply to the prompt: min_length counts characters (Korean is
# dense, so 10 is ample), the keyword is the stem 자연스러 so 자연스러운 /
# 자연스럽습니까 variants both pass.
protocol:
  name: "argument-structure-acceptability-kor"
  drift:
    min_length: 10
    require_question_mark: true
    keyword_case_sensitive: false
  families:
    - anchor:
        name: "acceptability"
        target_property: "acceptability"
        canonical_prompt: "어느 문장이 더 자연스러운가요?"
        options: ["first", "second"]
        is_ordered: false
        scale_type: "forced_choice"
        required_keywords: ["자연스러"]
        description: "2AFC acceptability judgment over a pair of Korean sentences."
      realization_kind: "template"

# Resource Configuration — LEGACY (read only by fill_templates.py; the current
# scripts load every lexicons/*.jsonl and templates/generic_frames.jsonl)
# ============================================================================
resources:
  # Lexicons
  lexicons:
    - path: "lexicons/verbs.jsonl"
      name: "verbs"
      description: "UniMorph verbs with frame information"

    - path: "lexicons/bleached_nouns.jsonl"
      name: "bleached_nouns"
      description: "Semantically light nouns for filling argument slots"

    - path: "lexicons/bleached_verbs.jsonl"
      name: "bleached_verbs"
      description: "Semantically light verbs for complex predicates"

    - path: "lexicons/bleached_adjectives.jsonl"
      name: "bleached_adjectives"
      description: "Semantically light adjectives for result/state slots"

    - path: "lexicons/case_markers.jsonl"
      name: "case_markers"
      description: "Case markers for Korean (nominative, accusative, dative, locative, instrumental)"

    - path: "lexicons/auxiliary_verbs.jsonl"
      name: "auxiliary_verbs"
      description: "Auxiliary verbs for complex predicates (past and present progressive forms for now)"

    - path: "lexicons/spatial_nouns.jsonl"
      name: "spatial_nouns"
      description: "Spatial and temporal relational nouns (postpositional bound nouns, NPOST)"

    - path: "lexicons/complex_postpositions.jsonl"
      name: "complex_postpositions"
      description: "Complex multi-morpheme postpositional expressions (DAT- and ACC-governed)"

    - path: "lexicons/comp_verbs.jsonl"
      name: "comp_verbs"
      description: "Bleached verb forms for complement clause slots (7 V.ADN.PRS + 7 PRS declarative)"

  # Templates
  templates:
    - path: "templates/generic_frames.jsonl"
      name: "generic_frames"
      description: "Generic frame structures constructed manually"

# Template Filling Strategy — LEGACY (fill_templates.py / create_2afc_pairs.py)
# ============================================================================
template:
