    #   max_fills: 5
    #   enforce_unique: true

    # recipient:
    #   strategy: "mlm"
    #   description: "MLM selection of recipient nouns"
    #   max_fills: 5
    #   enforce_unique: true

    # wh_noun:
    #   strategy: "mlm"
    #   description: "MLM selection of wh-clause nouns"
    #   max_fills: 5
    #   enforce_unique: true

    # ========================================================================
    # PREPOSITIONS - MLM with constraints
    # Uses existing ADP constraints from templates
    # ========================================================================
    # prep:
    #   strategy: "mlm"
    #   description: "MLM selection of prepositions (constrained by template)"
