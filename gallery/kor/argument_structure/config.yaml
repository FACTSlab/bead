    noun_pobj2:
      strategy: "exhaustive"
      description: "All bleached nouns as second prepositional objects"

    # noun_pobj3:
    #   strategy: "exhaustive"
    #   description: "All bleached nouns as third prepositional objects"

    # subj:
    #   strategy: "exhaustive"
    #   description: "All bleached nouns as subjects (alt slot name)"

    comp_subj:
      strategy: "exhaustive"
      description: "All bleached nouns as complement clause subjects"

    comp_nom:
      strategy: "exhaustive"
