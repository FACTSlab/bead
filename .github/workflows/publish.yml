name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: bead/deployment/jspsych/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: bead/deployment/jspsych/pnpm-lock.yaml

      - name: Build pinned browser assets
        working-directory: bead/deployment/jspsych
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: |
          python -m build
          python -m venv /tmp/bead-wheel
          /tmp/bead-wheel/bin/pip install --no-deps dist/*.whl
          /tmp/bead-wheel/bin/python -c 'from importlib.metadata import distribution; import hashlib, json; runtime = distribution("bead").locate_file("bead/deployment/jspsych/dist/runtime"); manifest = json.loads((runtime / "manifest.json").read_text()); assert all(hashlib.sha256((runtime / name).read_bytes()).hexdigest() == entry["sha256"] for name, entry in manifest.items())'

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bead
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
